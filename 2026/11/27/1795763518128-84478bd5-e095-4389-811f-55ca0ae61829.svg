<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, sans-serif">
  <defs>
    <linearGradient id="cardD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1224"/><stop offset="1" stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="barD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C3B"/><stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <filter id="glD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="g5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1080" height="560" rx="22" fill="url(#cardD)"/>
  <rect width="1080" height="560" rx="22" fill="url(#g5)"/>
  <rect x="0" y="0" width="1080" height="6" rx="3" fill="url(#barD)"/>

  <g>
    <rect x="44" y="40" rx="6" width="6" height="34" fill="#22D3EE" filter="url(#glD)"/>
    <text x="66" y="66" font-size="30" fill="#FFFFFF" font-weight="700">图 2｜读懂 PON 的四个关键数字</text>
    <text x="66" y="102" font-size="18" fill="#8FA6C8">分光比、光预算、距离都有标准上限，不是厂商随口说的</text>
  </g>

  <g transform="translate(0,16)">
    <g filter="url(#glD)">
      <rect x="70"  y="150" width="440" height="150" rx="18" fill="url(#tile)" stroke="#22D3EE" stroke-width="2"/>
      <rect x="570" y="150" width="440" height="150" rx="18" fill="url(#tile)" stroke="#22D3EE" stroke-width="2"/>
      <rect x="70"  y="322" width="440" height="150" rx="18" fill="url(#tile)" stroke="#22D3EE" stroke-opacity="0.65" stroke-width="2"/>
      <rect x="570" y="322" width="440" height="150" rx="18" fill="url(#tile)" stroke="#22D3EE" stroke-opacity="0.65" stroke-width="2"/>
    </g>
    <g fill="#22D3EE" font-size="44" font-weight="800">
      <text x="104" y="216">1 : 64</text>
      <text x="604" y="216">28 dB</text>
      <text x="104" y="388">60 km</text>
      <text x="604" y="388">1 : 128</text>
    </g>
    <g fill="#FFFFFF" font-size="21" font-weight="700">
      <text x="104" y="252">物理层分路比</text>
      <text x="604" y="252">Class B+ 最大损耗</text>
      <text x="104" y="424">最大逻辑距离</text>
      <text x="604" y="424">TC 层设计分路比</text>
    </g>
    <g fill="#8FA6C8" font-size="16">
      <text x="104" y="282">G.984.1 §12；1:64 约吃 20 dB 插损</text>
      <text x="604" y="282">G.984.2（2019），另留 2–3 dB 余量</text>
      <text x="104" y="454">G.984.1 §8；物理距离为 10/20 km 两档</text>
      <text x="604" y="454">G.984.1 §12（标准设计值）</text>
    </g>
  </g>

  <g>
    <line x1="44" y1="506" x2="1036" y2="506" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="44" y="540" font-size="19" fill="#7E93B8">数值均为标准标称值，实际部署以机型规格与现场测试为准</text>
    <text x="1036" y="540" font-size="15" fill="#4E5F7E" text-anchor="end">PON 知识图谱</text>
  </g>
</svg>
